# HTTP-only bootstrap config for ACME and initial testing.
# Replace this with the TLS config after certbot issues the certificate.

upstream awesometv_http {
    server 127.0.0.1:8409;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name atv.christopherrutherford.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://awesometv_http;
    }
}
