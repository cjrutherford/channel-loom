# Awesome TV — SWAG reverse proxy
#
# This is the config used by the live deployment:
#
#   DNS:   atv.christopherrutherford.net -> 45.79.204.77
#   SWAG:  LinuxServer.io SWAG container on the VPS
#   App:   nirvana.tail5a4a0.ts.net:8409 (Tailscale MagicDNS to the home host)
#
# Install at:
#   /opt/swag/config/nginx/proxy-confs/atv.subdomain.conf
#
# SWAG watches proxy-confs and reloads nginx automatically. The TLS certificate
# comes from /config/nginx/ssl.conf, which uses the SWAG cert covering
# atv.christopherrutherford.net (issued through the container's certbot).
#
# If the app host is not reachable by MagicDNS, replace the upstream with the
# Tailscale IP (100.120.253.100:8409) or a LAN address that the VPS can route.

upstream awesometv {
    server nirvana.tail5a4a0.ts.net:8409;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name atv.christopherrutherford.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atv.christopherrutherford.net;

    include /config/nginx/ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;
    client_body_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_redirect off;

    # Live HLS, Cast, DVR, catch-up, and cloud proxy responses must not be
    # buffered, and long-lived streams need generous read/send timeouts.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # The app still serves the protected admin console at /. Keep the hostname
    # private until the public viewer/admin split lands. To restrict the whole
    # site to LAN/Tailscale while testing:
    #
    # location / {
    #     allow 192.168.0.0/16;
    #     allow 100.64.0.0/10;
    #     deny all;
    #     proxy_pass http://awesometv;
    # }

    location / {
        proxy_pass http://awesometv;
    }

    location ~ ^/(channel|cast|catchup|dvr|cloud|webhooks)/ {
        proxy_pass http://awesometv;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
