# ChannelLoom reverse proxy
#
# DNS:    atv.christopherrutherford.net -> public IP
# Router: forward TCP 80 and 443 to this host
# App:    127.0.0.1:8409 (or 192.168.1.153:8409 if nginx is not on the app host)
#
# Replace the certificate paths if certbot uses a different live directory.

upstream awesometv {
    server 127.0.0.1:8409;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name atv.christopherrutherford.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atv.christopherrutherford.net;

    ssl_certificate     /etc/letsencrypt/live/atv.christopherrutherford.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atv.christopherrutherford.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # Enable after verifying HTTPS works.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;
    client_body_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_redirect off;

    # Live HLS/Cast/DVR and cloud proxy responses must not be buffered.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # `/` is the public viewer and `/admin` is login-gated by the app. To also
    # restrict the admin console to LAN/Tailscale at the proxy:
    #
    # location / {
    #     allow 192.168.0.0/16;
    #     allow 100.64.0.0/10;
    #     deny all;
    #     proxy_pass http://awesometv;
    # }

    location / {
        proxy_pass http://awesometv;
    }

    location ~ ^/(channel|cast|catchup|dvr|cloud|webhooks)/ {
        proxy_pass http://awesometv;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
