# Local-only release override; use alongside ../docker-compose.yml.
services:
  awesometv:
    image: awesometv:metadata-coverage-20261120
    environment:
      AWESOMETV_PRECACHE_ENABLED: "true"
      AWESOMETV_PRECACHE_DIR: /data/precache
      AWESOMETV_PRECACHE_MAX_GB: "250"
      AWESOMETV_PRECACHE_AHEAD_HOURS: "24"
