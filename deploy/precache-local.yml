# Larger precache budget for slow source mounts. Use alongside
# ../docker-compose.yml: docker compose -f docker-compose.yml -f deploy/precache-local.yml up -d
services:
  awesometv:
    environment:
      AWESOMETV_PRECACHE_ENABLED: "true"
      AWESOMETV_PRECACHE_DIR: /data/precache
      AWESOMETV_PRECACHE_MAX_GB: "250"
      AWESOMETV_PRECACHE_AHEAD_HOURS: "24"
