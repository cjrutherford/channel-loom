<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChannelLoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #10162b; --paper: #f5f7ff; --muted: #a8b3d4; --signal: #22d3cf; }
    body { margin: 0; background: radial-gradient(900px 520px at 50% 0%, rgba(34,211,207,.12), transparent 65%), var(--ink); color: var(--paper); font-family: "Nunito Sans", system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
    .lockup { display: grid; justify-items: center; gap: 16px; text-align: center; }
    .wordmark { width: min(340px, 72vw); height: auto; display: block; filter: drop-shadow(0 14px 40px rgba(0,0,0,.45)); }
    h1 { margin: 0; font-family: "Baloo 2", ui-rounded, sans-serif; font-size: 42px; font-weight: 700; letter-spacing: -.02em; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: var(--signal); margin-right: 8px; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,211,207,.5); } 70% { box-shadow: 0 0 0 7px rgba(34,211,207,0); } 100% { box-shadow: 0 0 0 0 rgba(34,211,207,0); } }
  </style>
</head>
<body>
  <div class="lockup">
    <img class="wordmark" src="channelloom-wordmark.png" alt="ChannelLoom">
    <p><span class="dot"></span>Your favorites are always on.</p>
    <p>Connecting to your channels…</p>
  </div>
</body>
</html>
