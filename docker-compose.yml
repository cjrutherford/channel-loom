# ChannelLoom. Copy .env.example to .env, set a password and your media path,
# then run `docker compose up -d`. Machine-specific settings (host networking,
# GPU devices, extra mounts) belong in docker-compose.override.yml, which
# Compose loads automatically and git ignores.
services:
  awesometv:
    image: ghcr.io/cjrutherford/channel-loom:${CHANNELLOOM_VERSION:-latest}
    build: .
    container_name: awesometv
    # Run as the owner of your data and media directories.
    user: "${AWESOMETV_UID:-1000}:${AWESOMETV_GID:-1000}"
    # Published on every host interface. Use "127.0.0.1:8409:8409" to keep it
    # local behind a reverse proxy.
    ports:
      - "${AWESOMETV_HOST_PORT:-8409}:8409"
    environment:
      # Leave empty to build links from the address each client used; set it
      # only to force one origin (for example a public HTTPS name).
      AWESOMETV_PUBLIC_URL: ${AWESOMETV_PUBLIC_URL:-}
      AWESOMETV_ADMIN_USER: ${AWESOMETV_ADMIN_USER:-admin}
      AWESOMETV_ADMIN_PASSWORD: ${AWESOMETV_ADMIN_PASSWORD:?set AWESOMETV_ADMIN_PASSWORD in .env}
      AWESOMETV_ADMIN_ALLOW_CIDRS: ${AWESOMETV_ADMIN_ALLOW_CIDRS:-}
      AWESOMETV_TOKEN_RATE_PER_MIN: ${AWESOMETV_TOKEN_RATE_PER_MIN:-600}
      AWESOMETV_OIDC_ISSUER: ${AWESOMETV_OIDC_ISSUER:-}
      AWESOMETV_OIDC_CLIENT_ID: ${AWESOMETV_OIDC_CLIENT_ID:-}
      AWESOMETV_OIDC_CLIENT_SECRET: ${AWESOMETV_OIDC_CLIENT_SECRET:-}
      AWESOMETV_OIDC_REDIRECT_URL: ${AWESOMETV_OIDC_REDIRECT_URL:-}
      AWESOMETV_OIDC_SCOPES: ${AWESOMETV_OIDC_SCOPES:-openid profile email}
      AWESOMETV_OIDC_ROLE_CLAIM: ${AWESOMETV_OIDC_ROLE_CLAIM:-roles}
      AWESOMETV_OIDC_ADMIN_ROLE: ${AWESOMETV_OIDC_ADMIN_ROLE:-admin}
      AWESOMETV_OIDC_OPERATOR_ROLE: ${AWESOMETV_OIDC_OPERATOR_ROLE:-operator}
      AWESOMETV_OIDC_VIEWER_ROLE: ${AWESOMETV_OIDC_VIEWER_ROLE:-viewer}
      AWESOMETV_OIDC_DEFAULT_ROLE: ${AWESOMETV_OIDC_DEFAULT_ROLE:-viewer}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      EMBY_URL: ${EMBY_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
      GOOGLE_DRIVE_API_BASE: ${GOOGLE_DRIVE_API_BASE:-}
      GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-}
      CLOUD_CACHE_MAX_GB: ${CLOUD_CACHE_MAX_GB:-500}
      CLOUD_AUTO_CACHE_MAX_MB: ${CLOUD_AUTO_CACHE_MAX_MB:-2048}
      AWESOMETV_SECRET_KEY: ${AWESOMETV_SECRET_KEY:-}
      AWESOMETV_SECRET_KEY_PREVIOUS: ${AWESOMETV_SECRET_KEY_PREVIOUS:-}
      AWESOMETV_CAST_BASE_URL: ${AWESOMETV_CAST_BASE_URL:-}
      AWESOMETV_CAST_RECEIVER_ID: ${AWESOMETV_CAST_RECEIVER_ID:-CC1AD845}
      # Global video bitrate ceiling in kbps for public streaming. 0 disables it.
      AWESOMETV_STREAM_MAX_KBPS: ${AWESOMETV_STREAM_MAX_KBPS:-0}
      # Per-client public request budgets, per minute. 0 disables a class.
      AWESOMETV_RATE_LIMIT_ENABLED: ${AWESOMETV_RATE_LIMIT_ENABLED:-true}
      AWESOMETV_RATE_LIMIT_API_PER_MIN: ${AWESOMETV_RATE_LIMIT_API_PER_MIN:-120}
      AWESOMETV_RATE_LIMIT_CAST_PER_MIN: ${AWESOMETV_RATE_LIMIT_CAST_PER_MIN:-20}
      AWESOMETV_RATE_LIMIT_PLAYLIST_PER_MIN: ${AWESOMETV_RATE_LIMIT_PLAYLIST_PER_MIN:-120}
      AWESOMETV_RATE_LIMIT_SEGMENT_PER_MIN: ${AWESOMETV_RATE_LIMIT_SEGMENT_PER_MIN:-1800}
      AWESOMETV_RATE_LIMIT_STREAM_PER_MIN: ${AWESOMETV_RATE_LIMIT_STREAM_PER_MIN:-12}
      AWESOMETV_MAX_CONCURRENT_STREAMS: ${AWESOMETV_MAX_CONCURRENT_STREAMS:-4}
      AWESOMETV_MAX_STREAMS_PER_CLIENT: ${AWESOMETV_MAX_STREAMS_PER_CLIENT:-2}
      # Local precache for slow source mounts.
      AWESOMETV_PRECACHE_ENABLED: ${AWESOMETV_PRECACHE_ENABLED:-true}
      AWESOMETV_PRECACHE_MAX_GB: ${AWESOMETV_PRECACHE_MAX_GB:-100}
      AWESOMETV_PRECACHE_AHEAD_HOURS: ${AWESOMETV_PRECACHE_AHEAD_HOURS:-24}
      AWESOMETV_PRECACHE_PROXY_KBPS: ${AWESOMETV_PRECACHE_PROXY_KBPS:-4000}
      AWESOMETV_PRECACHE_PROXY_HEIGHT: ${AWESOMETV_PRECACHE_PROXY_HEIGHT:-720}
      AWESOMETV_PRECACHE_COPY_MBPS: ${AWESOMETV_PRECACHE_COPY_MBPS:-7}
      # Restart a producer that drifts more than this far behind wall clock.
      AWESOMETV_PRODUCER_MAX_LAG_SECONDS: ${AWESOMETV_PRODUCER_MAX_LAG_SECONDS:-0}
      AWESOMETV_AUDIO_LANGUAGE: ${AWESOMETV_AUDIO_LANGUAGE:-eng}
      AWESOMETV_SUBTITLE_MODE: ${AWESOMETV_SUBTITLE_MODE:-off}
      AWESOMETV_SUBTITLE_LANGUAGE: ${AWESOMETV_SUBTITLE_LANGUAGE:-}
      RUST_LOG: ${RUST_LOG:-awesometv_server=info}
    volumes:
      - ${AWESOMETV_DATA_PATH:-./data}:/data
      - ${AWESOMETV_MEDIA_PATH:?set AWESOMETV_MEDIA_PATH in .env}:/media:ro
    # Optional VAAPI hardware encoding. Uncomment, and add the host's `render`
    # group id so the container user can open the device:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${AWESOMETV_RENDER_GID:-109}"
    restart: unless-stopped
