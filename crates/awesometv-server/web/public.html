<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awesome TV — Live</title>
<meta name="theme-color" content="#0b0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Awesome TV">
<meta name="description" content="Live channels and guide from Awesome TV.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #08090a;
    --panel: #0e1012;
    --panel-2: #131619;
    --line: #262b30;
    --line-soft: #1a1f23;
    --paper: #f3efe6;
    --muted: #9aa4ad;
    --dim: #6f7b84;
    --signal: #7ee7c7;
    --amber: #f5c26b;
    --red: #ff5a5f;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font-family: var(--body); }
  body {
    background:
      radial-gradient(1100px 600px at 10% -10%, rgba(126,231,199,.08), transparent 60%),
      radial-gradient(900px 500px at 95% 5%, rgba(245,194,107,.06), transparent 60%),
      var(--ink);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }
  a { color: var(--signal); }
  button { font: inherit; cursor: pointer; }
  .mono { font-family: var(--mono); }
  .tiny { font-size: 10px; }
  .dim { color: var(--dim); }
  .muted { color: var(--muted); }
  .top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--line-soft);
    background: rgba(8,9,10,.82); backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--paper); color: var(--ink);
    display: grid; place-items: center; font-family: var(--display); font-size: 22px; font-weight: 700;
    letter-spacing: -.03em; box-shadow: 0 0 0 1px rgba(255,255,255,.15), 0 8px 24px rgba(0,0,0,.4);
  }
  .brand-name { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .02em; line-height: .9; }
  .brand-sub { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--dim); margin-top: 4px; text-transform: uppercase; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--paper); border-radius: 7px;
    padding: 8px 12px; font-size: 12px; font-weight: 600; display: inline-flex; gap: 7px; align-items: center;
    text-decoration: none;
  }
  .btn:hover { border-color: #3b444c; background: #181c20; }
  .btn.ghost { background: transparent; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 22px 24px 60px; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
  .panel { border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.022), transparent 45%), var(--panel); border-radius: 12px; overflow: hidden; }
  .player { position: relative; background: #000; }
  .player video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; object-fit: contain; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 45%, #182026 0, #08090a 65%);
  }
  .overlay[hidden] { display: none; }
  .overlay-title { font-family: var(--display); font-size: clamp(38px, 6vw, 82px); line-height: .85; letter-spacing: .02em; color: #2c353c; text-transform: uppercase; }
  .overlay-sub { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: #54616a; margin-top: 10px; text-transform: uppercase; }
  .badges { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 8px; z-index: 3; }
  .badges-right { display: flex; gap: 8px; align-items: center; }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: rgba(255,255,255,.4); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 999px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    background: rgba(8,9,10,.78); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(8px);
  }
  .chip.live { color: var(--red); }
  .chip.live .dot { background: var(--red); animation: pulse 1.8s infinite; }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--signal); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,90,95,.45); } 70% { box-shadow: 0 0 0 7px rgba(255,90,95,0); } 100% { box-shadow: 0 0 0 0 rgba(255,90,95,0); } }
  .meta { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
  .no { font-family: var(--display); font-size: 46px; line-height: .8; color: var(--amber); }
  .copy { min-width: 0; flex: 1; }
  .copy .name { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .copy .now { font-family: var(--display); font-size: clamp(22px, 2.6vw, 32px); line-height: 1; text-transform: uppercase; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy .next { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { height: 4px; background: #22282d; border-radius: 99px; overflow: hidden; margin-top: 9px; }
  .progress > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--signal), var(--amber)); }
  .rail { display: grid; gap: 8px; max-height: min(70vh, 720px); overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
  .rail-card {
    display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 10px; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(255,255,255,.018);
    color: inherit; text-align: left;
  }
  .rail-card:hover { border-color: #3a444c; background: rgba(255,255,255,.035); }
  .rail-card.active { border-color: var(--signal); box-shadow: inset 0 0 0 1px rgba(126,231,199,.25); }
  .rail-no { font-family: var(--display); font-size: 25px; color: var(--amber); }
  .rail-copy { min-width: 0; display: grid; gap: 2px; }
  .rail-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-now { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-play { font-family: var(--mono); font-size: 10px; color: var(--signal); }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 30px 0 12px; }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin-bottom: 4px; }
  h2 { font-family: var(--display); font-size: 28px; text-transform: uppercase; letter-spacing: .03em; margin: 0; font-weight: 600; }
  .guide { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .guide-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); min-height: 46px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .guide-row:last-child { border-bottom: 0; }
  .guide-row:hover { background: rgba(255,255,255,.02); }
  .guide-label { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-right: 1px solid var(--line-soft); background: var(--panel-2); min-width: 0; }
  .guide-label .rail-no { font-size: 21px; }
  .guide-label .tiny { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guide-track { position: relative; min-height: 46px; }
  .guide-block {
    position: absolute; top: 5px; bottom: 5px; border-radius: 5px; padding: 5px 7px; overflow: hidden;
    font-size: 10px; color: #07100d; background: var(--signal); border: 1px solid rgba(0,0,0,.15);
  }
  .guide-block.filler { background: var(--amber); }
  .guide-block span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guide-now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--red); z-index: 3; }
  .guide-ticks { display: grid; grid-template-columns: 130px minmax(0, 1fr); background: var(--ink); border-bottom: 1px solid var(--line-soft); }
  .guide-ticks .spacer { border-right: 1px solid var(--line-soft); }
  .ticks { display: grid; grid-template-columns: repeat(6, 1fr); font-family: var(--mono); font-size: 9px; color: var(--dim); padding: 6px 0; }
  .ticks span { padding-left: 6px; border-left: 1px solid var(--line-soft); }
  .empty { padding: 28px 18px; text-align: center; color: var(--dim); }
  .toast-wrap { position: fixed; right: 18px; bottom: 18px; z-index: 120; display: grid; gap: 8px; }
  .toast { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 10px 13px; font-size: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: 360px; }
  .toast.err { background: var(--red); color: #fff; }
  footer { border-top: 1px solid var(--line-soft); padding: 16px 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--dim); font-family: var(--mono); font-size: 10px; }
  @media (max-width: 1000px) {
    .stage { grid-template-columns: 1fr; }
    .rail { max-height: none; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .guide-row { grid-template-columns: 96px minmax(0, 1fr); }
    .guide-ticks { grid-template-columns: 96px minmax(0, 1fr); }
  }
  @media (max-width: 620px) {
    .top { padding: 12px 14px; }
    .brand-sub, .clock { display: none; }
    .wrap { padding: 14px 14px 44px; }
    .meta { padding: 12px 14px; }
    .no { font-size: 38px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">
    <span class="brand-mark">AT</span>
    <span>
      <span class="brand-name">Awesome TV</span>
      <span class="brand-sub">Live channels</span>
    </span>
  </a>
  <div class="top-right">
    <span class="clock" id="clock"></span>
    <button class="btn ghost" id="castBtn">Cast</button>
    <button class="btn ghost" id="unmuteBtn" hidden>Sound on</button>
    <a class="btn ghost" href="/admin">Sign in</a>
  </div>
</header>

<main class="wrap">
  <section class="stage">
    <div class="panel player">
      <video id="player" controls playsinline></video>
      <div class="overlay" id="overlay">
        <div>
          <div class="overlay-title">Awesome TV</div>
          <div class="overlay-sub">Choose a channel to start watching</div>
        </div>
      </div>
      <div class="badges">
        <span class="chip live"><span class="dot"></span> On air</span>
        <span class="badges-right">
          <button class="chip" id="goLiveBtn" hidden>Go live</button>
          <span class="chip" id="bufferChip" hidden>Buffering</span>
        </span>
      </div>
      <div class="meta">
        <div class="no" id="channelNo">—</div>
        <div class="copy">
          <div class="name" id="channelName">Live</div>
          <div class="now" id="nowTitle">Loading…</div>
          <div class="next" id="nextTitle"></div>
          <div class="progress"><span id="progress"></span></div>
        </div>
      </div>
    </div>

    <aside class="rail" id="rail" aria-label="Channels"></aside>
  </section>

  <section id="guide">
    <div class="section-head">
      <div>
        <div class="eyebrow">What's on</div>
        <h2>Guide</h2>
      </div>
      <div class="mono tiny dim" id="guideRange"></div>
    </div>
    <div class="guide" id="guideBody"><div class="empty">Loading guide…</div></div>
  </section>
</main>

<footer>
  <span>AWESOME TV · SELF-HOSTED</span>
  <span id="statusLine">LIVE</span>
</footer>
<div class="toast-wrap" id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { channels: [], active: null, hls: null, muted: true, guideHours: 6, started: false };

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(text, error = false) {
  const el = document.createElement('div');
  el.className = `toast${error ? ' err' : ''}`;
  el.textContent = text;
  $('toasts').append(el);
  setTimeout(() => el.remove(), 4500);
}
function fmtClock(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function progress(item) {
  if (!item) return 0;
  const now = Date.now();
  return Math.max(0, Math.min(100, ((now - item.start_ms) / (item.end_ms - item.start_ms)) * 100));
}
async function getJSON(path) {
  const response = await fetch(path, { cache: 'no-store' });
  if (!response.ok) throw new Error(`${response.status}`);
  return response.json();
}
function current() {
  return state.channels.find((channel) => channel.number === state.active) || null;
}

function renderRail() {
  const rail = $('rail');
  if (!state.channels.length) {
    rail.innerHTML = '<div class="empty" style="grid-column:1/-1">No channels are live right now.</div>';
    return;
  }
  rail.innerHTML = state.channels.map((channel) => `
    <button class="rail-card ${channel.number === state.active ? 'active' : ''}" data-number="${esc(channel.number)}">
      <span class="rail-no">${esc(channel.number)}</span>
      <span class="rail-copy">
        <span class="rail-name">${esc(channel.name)}</span>
        <span class="rail-now">${esc(channel.now?.title || 'Off air')}</span>
      </span>
      <span class="rail-play">${channel.number === state.active ? '●' : '▶'}</span>
    </button>`).join('');
  rail.querySelectorAll('[data-number]').forEach((button) => {
    button.addEventListener('click', () => selectChannel(button.dataset.number, true));
  });
}

function renderNow() {
  const channel = current();
  if (!channel) return;
  $('channelNo').textContent = channel.number;
  $('channelName').textContent = channel.name;
  $('nowTitle').textContent = channel.now?.title || 'Off air';
  $('nextTitle').textContent = channel.next
    ? `Next at ${fmtClock(channel.next.start_ms)} · ${channel.next.title}`
    : '';
  $('progress').style.width = `${channel.now ? progress(channel.now) : 0}%`;
  document.title = `${channel.name} — Awesome TV`;
}

let hlsLoader = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (!hlsLoader) {
    hlsLoader = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1';
      script.onload = resolve;
      script.onerror = () => reject(new Error('player failed to load'));
      document.head.appendChild(script);
    });
  }
  return hlsLoader;
}

async function play(channel) {
  if (!channel) return;
  const video = $('player');
  try {
    await loadHls();
  } catch (error) {
    toast(String(error), true);
    return;
  }
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  $('overlay').hidden = true;
  const source = `/channel/${encodeURIComponent(channel.number)}.m3u8`;
  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({
      // Stay close to the live edge; the producer is real-time, so a deep
      // buffer is not needed. Speed up briefly when a stall pushes us behind.
      liveSyncDurationCount: 2,
      liveMaxLatencyDurationCount: 6,
      maxLiveSyncPlaybackRate: 1.5,
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      backBufferLength: 30,
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 800,
      levelLoadingMaxRetry: 6,
      fragLoadingMaxRetry: 8,
      fragLoadingRetryDelay: 800
    });
    state.hls = hls;
    hls.on(Hls.Events.LEVEL_UPDATED, updateLiveLag);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.muted = state.muted;
      video.play().catch(() => {
        state.muted = true;
        video.muted = true;
        video.play().catch(() => {});
      });
    });
    hls.on(Hls.Events.ERROR, (_event, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        toast(`Playback error: ${data.type}`, true);
      }
    });
    hls.loadSource(source);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = source;
    video.play().catch(() => {});
  } else {
    toast('This browser cannot play HLS.', true);
  }
  state.started = true;
}

function selectChannel(number, autoplay) {
  const channel = state.channels.find((entry) => entry.number === String(number));
  if (!channel) return;
  state.active = channel.number;
  const url = new URL(location.href);
  url.searchParams.set('channel', channel.number);
  history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  renderRail();
  renderNow();
  if (autoplay) play(channel);
}

async function refreshChannels() {
  try {
    const channels = await getJSON('/api/v1/public/channels');
    const previous = state.active;
    state.channels = channels;
    if (!state.channels.length) {
      $('nowTitle').textContent = 'No channels configured';
      renderRail();
      return;
    }
    if (!state.active) {
      const requested = new URLSearchParams(location.search).get('channel');
      const match = state.channels.find((channel) => channel.number === requested);
      state.active = match ? match.number : state.channels[0].number;
    } else if (!state.channels.some((channel) => channel.number === state.active)) {
      state.active = state.channels[0].number;
    }
    renderRail();
    renderNow();
    if (!state.started) {
      const channel = current();
      if (channel) play(channel);
    }
    if (previous && previous !== state.active) renderNow();
    $('statusLine').textContent = `LIVE · ${state.channels.length} CHANNELS`;
  } catch (error) {
    $('statusLine').textContent = 'OFFLINE';
    if (!state.channels.length) toast('Could not load channels', true);
  }
}

async function loadGuide() {
  try {
    const guide = await getJSON(`/api/v1/public/guide?hours=${state.guideHours}`);
    const now = Date.now();
    const start = Math.floor((now - 3_600_000) / 3_600_000) * 3_600_000;
    const span = state.guideHours * 3_600_000;
    const nowLeft = Math.max(0, Math.min(100, ((now - start) / span) * 100));
    const ticks = Array.from({ length: state.guideHours }, (_, index) =>
      `<span>${fmtClock(start + index * 3_600_000)}</span>`).join('');
    const rows = guide.map((channel) => {
      const blocks = channel.items.filter((item) => item.end_ms > start && item.start_ms < start + span).map((item) => {
        const left = Math.max(0, ((item.start_ms - start) / span) * 100);
        const width = Math.min(100 - left, ((item.end_ms - item.start_ms) / span) * 100);
        return `<div class="guide-block ${item.kind === 'filler' ? 'filler' : ''}" style="left:${left}%;width:${Math.max(1, width)}%" title="${esc(item.title)} · ${fmtClock(item.start_ms)}">
          <span>${esc(item.title)}</span>
        </div>`;
      }).join('');
      return `<div class="guide-row" data-number="${esc(channel.number)}">
        <div class="guide-label"><span class="rail-no">${esc(channel.number)}</span><span class="tiny">${esc(channel.name)}</span></div>
        <div class="guide-track">${blocks}<div class="guide-now" style="left:${nowLeft}%"></div></div>
      </div>`;
    }).join('');
    $('guideBody').innerHTML = `
      <div class="guide-ticks"><div class="spacer"></div><div class="ticks" style="grid-template-columns:repeat(${state.guideHours},1fr)">${ticks}</div></div>
      ${rows}`;
    $('guideRange').textContent = `${fmtClock(start)} – ${fmtClock(start + span)}`;
    $('guideBody').querySelectorAll('.guide-row[data-number]').forEach((row) => {
      row.addEventListener('click', () => {
        selectChannel(row.dataset.number, true);
        $('player').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  } catch {
    $('guideBody').innerHTML = '<div class="empty">Guide unavailable.</div>';
  }
}

function updateLiveLag() {
  const hls = state.hls;
  const video = $('player');
  const edge = hls?.liveSyncPosition;
  if (edge == null || !Number.isFinite(edge)) { $('goLiveBtn').hidden = true; return; }
  const lag = edge - video.currentTime;
  $('goLiveBtn').hidden = !(lag > 10);
  if (!Number.isFinite(lag) || lag <= 0) return;
  $('goLiveBtn').textContent = `Live −${Math.round(lag)}s`;
}

$('goLiveBtn').addEventListener('click', () => {
  const video = $('player');
  const edge = state.hls?.liveSyncPosition;
  if (edge != null && Number.isFinite(edge)) video.currentTime = edge;
  video.play().catch(() => {});
  $('goLiveBtn').hidden = true;
});

let castSdkPromise = null;
let castInitialized = false;
function castContextOrNull() {
  return window.cast?.framework?.CastContext?.getInstance?.() || null;
}
function loadCastSdk() {
  if (window.cast && window.cast.framework) return Promise.resolve();
  if (castSdkPromise) return castSdkPromise;
  castSdkPromise = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('Cast SDK load timed out')), 12000);
    window.__onGCastApiAvailable = (available) => {
      clearTimeout(timer);
      if (available) resolve(); else reject(new Error('Cast SDK unavailable'));
    };
    const script = document.createElement('script');
    script.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
    script.onerror = () => { clearTimeout(timer); reject(new Error('Failed to load Cast SDK')); };
    document.head.appendChild(script);
  });
  return castSdkPromise;
}
function updateCastButton() {
  const context = castContextOrNull();
  $('castBtn').textContent = context?.getCurrentSession() ? 'Stop cast' : 'Cast';
}
async function initializeCast() {
  const context = castContextOrNull();
  if (!context) return null;
  if (!castInitialized) {
    context.setOptions({
      receiverApplicationId: 'CC1AD845',
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });
    context.addEventListener(
      cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
      () => updateCastButton()
    );
    castInitialized = true;
  }
  return context;
}
async function castActiveChannel() {
  const channel = current();
  if (!channel) { toast('Select a channel first.', true); return; }
  if (!(location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    toast('Cast requires HTTPS or localhost.', true);
    return;
  }
  try {
    await loadCastSdk();
    const context = await initializeCast();
    if (!context) throw new Error('Cast is unavailable in this browser');
    if (!context.getCurrentSession()) await context.requestSession();
    const response = await fetch(`/api/v1/public/channels/${encodeURIComponent(channel.number)}/cast`, { method: 'POST' });
    if (!response.ok) throw new Error(`Cast request failed (${response.status})`);
    const info = await response.json();
    const mediaInfo = new chrome.cast.media.MediaInfo(info.media_url, info.content_type);
    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
    mediaInfo.metadata.title = info.title;
    mediaInfo.metadata.subtitle = channel.name;
    const request = new chrome.cast.media.LoadRequest(mediaInfo);
    request.autoplay = true;
    await context.getCurrentSession().loadMedia(request);
    updateCastButton();
    toast(`Casting ${info.title}.`);
  } catch (error) {
    toast(String(error), true);
  }
}
function stopCasting() {
  const session = castContextOrNull()?.getCurrentSession();
  if (session) session.endSession(true);
  updateCastButton();
}
$('castBtn').addEventListener('click', () => {
  const context = castContextOrNull();
  if (context?.getCurrentSession()) stopCasting();
  else castActiveChannel();
});

$('unmuteBtn').addEventListener('click', () => {
  const video = $('player');
  state.muted = false;
  video.muted = false;
  video.play().catch(() => {});
  $('unmuteBtn').hidden = true;
});

const video = $('player');
video.addEventListener('volumechange', () => {
  state.muted = video.muted;
  $('unmuteBtn').hidden = !video.muted;
});
video.addEventListener('waiting', () => { $('bufferChip').hidden = false; });
video.addEventListener('playing', () => { $('bufferChip').hidden = true; });
video.addEventListener('canplay', () => { $('bufferChip').hidden = true; });

document.addEventListener('keydown', (event) => {
  if (event.target && /input|textarea|select/i.test(event.target.tagName)) return;
  const index = state.channels.findIndex((channel) => channel.number === state.active);
  if (event.key === 'ArrowDown' || event.key === ']') {
    event.preventDefault();
    const next = state.channels[Math.min(state.channels.length - 1, index + 1)];
    if (next) selectChannel(next.number, true);
  } else if (event.key === 'ArrowUp' || event.key === '[') {
    event.preventDefault();
    const previous = state.channels[Math.max(0, index - 1)];
    if (previous) selectChannel(previous.number, true);
  } else if (event.key.toLowerCase() === 'm') {
    video.muted = !video.muted;
  }
});

setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const channel = current();
  if (channel?.now) $('progress').style.width = `${progress(channel.now)}%`;
  updateLiveLag();
}, 1000);
setInterval(refreshChannels, 15000);
setInterval(loadGuide, 600000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

refreshChannels();
loadGuide();
if (location.hash === '#guide') setTimeout(() => $('guide').scrollIntoView({ behavior: 'smooth' }), 400);
</script>
</body>
