<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome TV — Cast Receiver</title>
<meta name="theme-color" content="#070809">
<style>
  :root {
    --ink: #070809;
    --paper: #f4f0e7;
    --muted: #a7b1b8;
    --signal: #7fe9c8;
    --red: #ff5f64;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: "IBM Plex Sans", system-ui, sans-serif; }
  cast-media-player {
    --video-bg-color: #000;
    --splash-image: url("/icons/icon-512.png");
    --splash-background: #070809;
    width: 100%; height: 100%;
  }
  .brand {
    position: fixed; top: 30px; left: 34px; z-index: 10; display: flex; align-items: center; gap: 12px;
    font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    text-shadow: 0 2px 22px rgba(0,0,0,.75);
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; background: var(--paper); color: var(--ink);
    display: grid; place-items: center; font-size: 26px; letter-spacing: -.04em;
    box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 12px 34px rgba(0,0,0,.55);
  }
  .live {
    position: fixed; top: 40px; right: 34px; z-index: 10; display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 11px; border-radius: 999px; border: 1px solid rgba(255,95,100,.4);
    background: rgba(7,8,9,.68); color: var(--red); font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; backdrop-filter: blur(10px);
  }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--red); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,95,100,.5); } 70% { box-shadow: 0 0 0 8px rgba(255,95,100,0); } 100% { box-shadow: 0 0 0 0 rgba(255,95,100,0); } }
  .now {
    position: fixed; top: 86px; left: 34px; z-index: 10; max-width: min(70vw, 900px);
    text-shadow: 0 2px 20px rgba(0,0,0,.8);
  }
  .now .title { font-family: var(--display); font-size: clamp(26px, 3.2vw, 46px); line-height: .95; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .sub { margin-top: 5px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .footer {
    position: fixed; bottom: 26px; right: 34px; z-index: 10; font-family: var(--mono); font-size: 10px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<cast-media-player id="player"></cast-media-player>
<div class="brand"><span class="mark">AT</span><span>Awesome TV</span></div>
<div class="live"><span class="dot"></span> Live</div>
<div class="now">
  <div class="title" id="nowTitle">Awesome TV</div>
  <div class="sub" id="nowSub">Live channels</div>
</div>
<div class="footer">awesome tv · self-hosted</div>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
  const context = cast.framework.CastReceiverContext.getInstance();
  const playerManager = context.getPlayerManager();
  const nowTitle = document.getElementById('nowTitle');
  const nowSub = document.getElementById('nowSub');

  function refreshNowPlaying() {
    try {
      const info = playerManager.getMediaInformation();
      const metadata = info && info.metadata;
      if (!metadata) return;
      if (metadata.title) nowTitle.textContent = metadata.title;
      if (metadata.subtitle) nowSub.textContent = metadata.subtitle;
      else if (metadata.seriesTitle) nowSub.textContent = metadata.seriesTitle;
    } catch {}
  }

  context.start({ disableIdleTimeout: true });
  try {
    context.addEventListener(cast.framework.system.EventType.READY, refreshNowPlaying);
  } catch {}
  try {
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOADING,
      refreshNowPlaying
    );
  } catch {}
  setInterval(refreshNowPlaying, 1500);
</script>
</body>
</html>
