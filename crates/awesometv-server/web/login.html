<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Awesome TV</title>
<meta name="theme-color" content="#0b0f12">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #08090a;
    --panel: #0e1012;
    --line: #262b30;
    --paper: #f3efe6;
    --muted: #9aa4ad;
    --dim: #6f7b84;
    --signal: #7ee7c7;
    --red: #ff5a5f;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font-family: var(--body); }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(126,231,199,.09), transparent 65%),
      radial-gradient(700px 400px at 90% 90%, rgba(245,194,107,.05), transparent 60%),
      var(--ink);
  }
  .card { width: min(390px, 100%); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 26px; box-shadow: 0 30px 90px rgba(0,0,0,.65); }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px; background: var(--paper); color: var(--ink);
    display: grid; place-items: center; font-family: var(--display); font-size: 24px; font-weight: 700;
  }
  .brand-name { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: .9; }
  .brand-sub { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--dim); margin-top: 4px; text-transform: uppercase; }
  h1 { font-family: var(--display); font-size: 36px; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: grid; gap: 6px; margin-bottom: 12px; }
  label span { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  input {
    background: #08090a; border: 1px solid var(--line); color: var(--paper); border-radius: 8px;
    padding: 11px 12px; font: inherit;
  }
  input:focus { outline: 2px solid rgba(126,231,199,.45); outline-offset: 1px; border-color: var(--signal); }
  button {
    width: 100%; margin-top: 6px; border: 1px solid var(--paper); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 11px 12px; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .error { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--red); }
  .back { display: inline-block; margin-top: 18px; font-family: var(--mono); font-size: 10px; color: var(--dim); text-decoration: none; }
  .back:hover { color: var(--signal); }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="brand-mark">AT</div>
    <div>
      <div class="brand-name">Awesome TV</div>
      <div class="brand-sub">Broadcast control</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <p>Administrator access for channels, sources, and programming.</p>
  <form id="loginForm">
    <label for="username"><span>Username</span><input id="username" name="username" autocomplete="username" required autofocus></label>
    <label for="password"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="submitBtn">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <a class="back" href="/">← Back to live TV</a>
</main>
<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const submit = document.getElementById('submitBtn');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.textContent = '';
  submit.disabled = true;
  try {
    const response = await fetch('/api/v1/auth/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (response.ok) {
      location.replace('/admin');
      return;
    }
    if (response.status === 429) {
      const retry = Number(response.headers.get('Retry-After') || 0);
      const minutes = retry > 0 ? Math.max(1, Math.ceil(retry / 60)) : 1;
      errorBox.textContent = `Too many failed attempts. Try again in about ${minutes} minute${minutes === 1 ? '' : 's'}.`;
    } else {
      errorBox.textContent = 'Invalid username or password.';
    }
  } catch {
    errorBox.textContent = 'Could not reach the server.';
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
