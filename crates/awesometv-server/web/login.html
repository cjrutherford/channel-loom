<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — ChannelLoom Studio</title>
<meta name="theme-color" content="#10162B">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/channelloom.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10162b;
    --panel: #151d36;
    --line: #2b3557;
    --paper: #f5f7ff;
    --muted: #a8b3d4;
    --dim: #7581a5;
    --signal: #22d3cf;
    --red: #ff6b7a;
    --display: "Baloo 2", ui-rounded, "Trebuchet MS", sans-serif;
    --body: "Nunito Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font-family: var(--body); }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(34,211,207,.12), transparent 65%),
      radial-gradient(700px 400px at 90% 90%, rgba(146,82,223,.10), transparent 60%),
      var(--ink);
  }
  .card { width: min(390px, 100%); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 26px; box-shadow: 0 30px 90px rgba(0,0,0,.65); }
  .brand { display: grid; justify-items: start; gap: 4px; margin-bottom: 20px; }
  .brand-wordmark { height: 44px; width: auto; display: block; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 10px; overflow: hidden;
    background: #0b1120 url("/icons/icon-192.png") center/cover no-repeat;
    box-shadow: 0 0 0 1px rgba(34,211,207,.35), 0 8px 24px rgba(0,0,0,.45);
    flex: 0 0 auto;
  }
  .brand-name { font-family: var(--display); font-size: 25px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
  .brand-sub { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--dim); margin-top: 4px; text-transform: uppercase; }
  h1 { font-family: var(--display); font-size: 38px; letter-spacing: -.015em; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: grid; gap: 6px; margin-bottom: 12px; }
  label span { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  input {
    background: #0b1120; border: 1px solid var(--line); color: var(--paper); border-radius: 8px;
    padding: 11px 12px; font: inherit;
  }
  input:focus { outline: 2px solid rgba(34,211,207,.45); outline-offset: 1px; border-color: var(--signal); }
  button {
    width: 100%; margin-top: 6px; border: 1px solid var(--signal); background: var(--signal); color: #06202b;
    border-radius: 8px; padding: 11px 12px; font: inherit; font-weight: 800; cursor: pointer;
  }
  button:hover { background: #5ce6e1; }
  button:disabled { opacity: .55; cursor: default; }
  .error { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--red); }
  .back { display: inline-block; margin-top: 18px; font-family: var(--mono); font-size: 10px; color: var(--dim); text-decoration: none; }
  .back:hover { color: var(--signal); }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img class="brand-wordmark" src="/icons/channelloom-wordmark.png" alt="ChannelLoom">
    <div class="brand-sub">Studio</div>
  </div>
  <h1>Welcome back</h1>
  <p>Sign in to build channels, arrange what plays, and manage your library.</p>
  <form id="loginForm">
    <label for="username"><span>Username</span><input id="username" name="username" autocomplete="username" required autofocus></label>
    <label for="password"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="submitBtn">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <a class="back" id="oidcBtn" href="/auth/oidc/start" style="display:none; margin-top:12px; font-size:12px;">Sign in with SSO</a>
  <a class="back" href="/">← Back to Watch</a>
</main>
<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const submit = document.getElementById('submitBtn');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.textContent = '';
  submit.disabled = true;
  try {
    const response = await fetch('/api/v1/auth/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (response.ok) {
      location.replace('/admin');
      return;
    }
    if (response.status === 429) {
      const retry = Number(response.headers.get('Retry-After') || 0);
      const minutes = retry > 0 ? Math.max(1, Math.ceil(retry / 60)) : 1;
      errorBox.textContent = `Too many failed attempts. Try again in about ${minutes} minute${minutes === 1 ? '' : 's'}.`;
    } else {
      errorBox.textContent = 'Invalid username or password.';
    }
  } catch {
    errorBox.textContent = 'We could not reach the server. Please try again.';
  } finally {
    submit.disabled = false;
  }
});
  fetch('/api/v1/public/config', { cache: 'no-store' })
    .then((response) => response.ok ? response.json() : null)
    .then((config) => { if (config?.oidc_enabled) document.getElementById('oidcBtn').style.display = 'inline-block'; })
    .catch(() => {});
</script>
</body>
</html>
