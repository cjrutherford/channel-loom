name: Release

# Push a tag that matches the workspace version, for example:
#   git tag v0.1.4 && git push origin v0.1.4
# A tag with a suffix (v0.2.0-rc.1) publishes a prerelease and does not move
# the `latest` image tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Tag matches every package version
        run: |
          tag=${GITHUB_REF_NAME#v}
          python3 - "$tag" <<'EOF'
          import json, re, sys, tomllib
          tag = sys.argv[1]
          found = {
              "Cargo.toml": tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"],
              "desktop/src-tauri/Cargo.toml": tomllib.load(open("desktop/src-tauri/Cargo.toml", "rb"))["package"]["version"],
              "desktop/src-tauri/tauri.conf.json": json.load(open("desktop/src-tauri/tauri.conf.json"))["version"],
              "android-tv/app/build.gradle": re.search(r"versionName\s+['\"]([^'\"]+)['\"]", open("android-tv/app/build.gradle").read()).group(1),
          }
          bad = {f: v for f, v in found.items() if v != tag}
          for f, v in found.items():
              print(f"{f}: {v}")
          if bad:
              sys.exit(f"tag v{tag} does not match: {bad}")
          EOF
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  image:
    name: Publish image
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # semver tags already skip `latest` and `X.Y` for prereleases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Smoke test the published image
        run: scripts/docker-smoke.sh "${IMAGE}:${{ needs.version.outputs.version }}" "${{ needs.version.outputs.version }}"

  server:
    name: Server tarballs
    needs: [version, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built in the image's build stage (Debian bookworm, glibc 2.36) so the
      # binary runs on older distributions too.
      - name: Build binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          platforms: linux/amd64,linux/arm64
          build-args: |
            REVISION=${{ github.sha }}
          outputs: type=local,dest=out
          cache-from: type=gha
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name="channelloom-server-${VERSION}-linux-${arch}"
            mkdir -p "stage/$name"
            install -m 0755 "out/linux_${arch}/awesometv-server" "stage/$name/awesometv-server"
            cp README.md "stage/$name/"
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          done
          file stage/*/awesometv-server
      - uses: actions/upload-artifact@v7
        with:
          name: release-server
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Signed Android TV APK
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CHANNELLOOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHANNELLOOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHANNELLOOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/RELEASE.md"
            exit 1
          fi
          export CHANNELLOOM_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CHANNELLOOM_KEYSTORE"
          chmod +x android-tv/gradlew
          (cd android-tv && ./gradlew assembleRelease --no-daemon --stacktrace)
          rm -f "$CHANNELLOOM_KEYSTORE"
      - name: Verify signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=android-tv/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/channelloom-android-tv-${VERSION}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, ci, image, server, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          cp artifacts/release-server/*.tar.gz release/
          cp artifacts/release-android/*.apk release/
          find artifacts/awesometv-desktop-linux-amd64 -name '*.deb' -exec cp {} release/ \;
          ls release/*.deb >/dev/null
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: ChannelLoom v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ```

            Or set `CHANNELLOOM_VERSION=${{ needs.version.outputs.version }}` in `.env` and run `docker compose up -d` with the repository's `docker-compose.yml`. Images are published for `linux/amd64` and `linux/arm64`.

            ## Assets

            - `channelloom-server-*-linux-{amd64,arm64}.tar.gz`: the server binary. FFmpeg must be installed on the host.
            - `channelloom-android-tv-*.apk`: the Android TV client. Sideload it on the TV.
            - `*.deb`: the Linux desktop client.
            - `SHA256SUMS`: checksums for the files above.
          files: |
            release/*
