pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central. CI runners share IPs that Maven
        // Central rate-limits (HTTP 429); mavenCentral() stays as the fallback.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Google's mirror of Maven Central. CI runners share IPs that Maven
        // Central rate-limits (HTTP 429); mavenCentral() stays as the fallback.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = "AwesomeTV"
include ":app"
