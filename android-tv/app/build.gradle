plugins {
    id 'com.android.application'
}

def appUrl = project.findProperty('awesometv.url') ?: 'https://nirvana.tail5a4a0.ts.net:8447/'

android {
    namespace 'net.christopherrutherford.awesometv'
    compileSdk 36

    defaultConfig {
        applicationId 'net.christopherrutherford.awesometv'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
