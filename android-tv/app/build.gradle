plugins {
    id 'com.android.application'
}

// Optional preset server, e.g. -Pawesometv.url=http://192.168.1.20:8409/.
// Without it the app asks for a server on first launch.
def appUrl = project.findProperty('awesometv.url') ?: ''

android {
    namespace 'net.christopherrutherford.awesometv'
    compileSdk 36

    defaultConfig {
        applicationId 'net.christopherrutherford.awesometv'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
