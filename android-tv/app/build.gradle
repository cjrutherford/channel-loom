plugins {
    id 'com.android.application'
}

// Optional preset server, e.g. -Pawesometv.url=http://192.168.1.20:8409/.
// Without it the app asks for a server on first launch.
def appUrl = project.findProperty('awesometv.url') ?: ''

// Release signing comes from the environment so the keystore never enters the
// repository. Without CHANNELLOOM_KEYSTORE, assembleRelease produces an
// unsigned APK.
def releaseKeystore = System.getenv('CHANNELLOOM_KEYSTORE')

android {
    namespace 'net.christopherrutherford.channelloom'
    compileSdk 36

    defaultConfig {
        applicationId 'net.christopherrutherford.channelloom'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('CHANNELLOOM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHANNELLOOM_KEY_ALIAS')
                keyPassword System.getenv('CHANNELLOOM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
